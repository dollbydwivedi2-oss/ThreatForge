<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatForge Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
    .dash-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 14px 30px;
        background: rgba(5, 7, 15, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.07);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 100;
    }
    .dash-nav .brand {
        font-size: 18px;
        font-weight: 700;
        color: #00d4ff;
        letter-spacing: 1px;
    }
    .dash-nav .logout-btn {
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.06);
        color: #ccc;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s;
    }
    .dash-nav .logout-btn:hover {
        background: rgba(255,255,255,0.12);
        color: white;
    }
    .dash-content {
        padding-top: 80px;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }
    .dash-welcome {
        text-align: center;
        padding: 40px 20px 20px;
    }
    .dash-welcome h1 {
        font-size: 2.2rem;
        color: #00d4ff;
        margin-bottom: 8px;
    }
    .dash-welcome p {
        color: #a0aec0;
        font-size: 1rem;
    }
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        width: 100%;
        max-width: 700px;
        padding: 20px;
    }
    .stat-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 22px 18px;
        text-align: center;
        backdrop-filter: blur(10px);
    }
    .stat-card .stat-icon {
        font-size: 28px;
        margin-bottom: 8px;
    }
    .stat-card .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: #00d4ff;
    }
    .stat-card .stat-label {
        font-size: 12px;
        color: #7a8a99;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .action-area {
        padding: 10px 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 700px;
    }
    .action-area h2 {
        font-size: 1rem;
        color: #7a8a99;
        text-transform: uppercase;
        letter-spacing: 1px;
        align-self: flex-start;
    }
    .threat-card {
        width: 100%;
        background: rgba(0, 212, 255, 0.06);
        border: 1px solid rgba(0, 212, 255, 0.2);
        border-radius: 14px;
        padding: 24px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }
    .threat-card-info h3 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #e6e6e6;
        margin-bottom: 6px;
    }
    .threat-card-info p {
        font-size: 13px;
        color: #7a8a99;
    }
    .open-btn {
        padding: 12px 28px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(45deg, #00d4ff, #0077ff);
        color: white;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.3s;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
    }
    .open-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 28px rgba(0, 212, 255, 0.5);
    }
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #00e676;
        background: rgba(0,230,118,0.1);
        border: 1px solid rgba(0,230,118,0.2);
        border-radius: 20px;
        padding: 4px 12px;
        margin-top: 8px;
    }
    .status-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #00e676;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
    @media (max-width: 500px) {
        .dash-welcome h1 { font-size: 1.6rem; }
        .threat-card { flex-direction: column; }
    }
</style>
</head>
<body>

<nav class="dash-nav">
    <span class="brand">🛡️ THREATFORGE</span>
    <a href="login.html" class="logout-btn">Logout</a>
</nav>

<div class="dash-content">

    <div class="dash-welcome">
        <h1>Welcome to Dashboard</h1>
        <p>Monitor and analyze threats from one place</p>
        <div class="status-badge">
            <span class="status-dot"></span>
            System Online
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">🔍</div>
            <div class="stat-value">0</div>
            <div class="stat-label">Scans Run</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🚨</div>
            <div class="stat-value">0</div>
            <div class="stat-label">Threats Found</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-value">0</div>
            <div class="stat-label">Safe Messages</div>
        </div>
    </div>

    <div class="action-area">
        <h2>Quick Access</h2>
        <div class="threat-card">
            <div class="threat-card-info">
                <h3>ThreatForge Analyzer</h3>
                <p>Scan emails, SMS, and messages for phishing threats using AI-powered detection.</p>
            </div>
            <a href="analyzer.html" target="_blank" class="open-btn">Open ThreatForge Analyzer</a>
        </div>
    </div>

</div>

</body>
</html>
